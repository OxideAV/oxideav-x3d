[package]
name = "oxideav-x3d-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
oxideav-mesh3d = { version = "0.0", default-features = false }

[dependencies.oxideav-x3d]
path = ".."
default-features = false

[[bin]]
name = "decode"
path = "fuzz_targets/decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "roundtrip"
path = "fuzz_targets/roundtrip.rs"
test = false
doc = false
bench = false

# The fuzz crate is its own workspace root (it sits inside the
# umbrella tree but is not a member of it).
[workspace]
